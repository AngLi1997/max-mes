spring:
  shardingsphere:
    datasource:
      names: ds_0
      ds_0:
        type: com.alibaba.druid.pool.DruidDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: 'jdbc:mysql://${db.host}/${db.schema}?useUnicode=true&characterEncoding=UTF8&autoReconnect=true&useSSL=false&allowMultiQueries=true&serverTimezone=GMT'
        username: ${db.username}
        password: ${db.password}
    rules:
      sharding:
        tables:
          bm_execute_form_data:
            actual-data-nodes: ds_0.bm_execute_form_data_$->{0..49}
            table-strategy:
              standard:
                sharding-column: product_plan_id
                sharding-algorithm-name: bm_execute_form_data_hash
        sharding-algorithms:
          bm_execute_form_data_hash:
            type: INLINE
            props:
              algorithm-expression: bm_execute_form_data_$->{product_plan_id % 50}
    props:
      sql-show: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure