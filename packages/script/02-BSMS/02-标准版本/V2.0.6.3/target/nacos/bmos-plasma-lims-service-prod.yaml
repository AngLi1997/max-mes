db:
  schema: bmos_lims
server:
  servlet:
    context-path: /api/${api-module}/
  port: 58201
api-module: bmos-lims
spring:
  application:
    name: bmos-plasma-lims-service
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER


mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: true # 逻辑已删除值(默认为 1)
      logic-not-delete-value: false # 逻辑未删除值(默认为 0)
      update-strategy: not_null
bmos:
  i18n:
    locations:
      - i18n/message_plasma
      - i18n/validate_plasma
  auth:
    exclude-urls:
      - ${server.servlet.context-path}/user/login
      - ${server.servlet.context-path}/swagger-ui/**
      - ${server.servlet.context-path}/swagger-resources/**
      - ${server.servlet.context-path}/api-docs
      - ${server.servlet.context-path}/v3/api-docs
    activeUrls:
      - ${server.servlet.context-path}/license/active
      - ${server.servlet.context-path}/license/activated
      - ${server.servlet.context-path}/sample/update/appearance
      - ${server.servlet.context-path}/pre/prethawing
    enable: true
minio:
  server: http://127.0.0.1
  port: 9000
  endpoint: ${minio.server}:${minio.port}
  accessKey: minio
  secretKey: Bmos1018
  buckets:
    plasma: bmos-plasma
    signature: bmos-platform-sign

pcr:
  check_type: PCR-实时荧光法
  
lims:
  titer:
    value:
      max: 50

# pdf导出模板路径
export:
  templateRoute:
    report: /template/inspectionReport.docx
    reportAnnex: /template/inspectionReport_annex.docx