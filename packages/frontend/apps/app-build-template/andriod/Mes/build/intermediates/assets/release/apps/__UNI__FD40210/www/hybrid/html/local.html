<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0,minimum-scale=0.33,maximum-scale=3">
		<title>Document</title>
		<link type="text/css" rel="stylesheet" href="./style/textareaStyle.css">
		<link type="text/css" rel="stylesheet" href="./style/radioStyle.css">
		<link type="text/css" rel="stylesheet" href="./style/checkboxStyle.css">
		<link type="text/css" rel="stylesheet" href="./style/buttons.css">
	</head>
	<body id="body">
		<form id="form-box"></form>
		<!-- 页面上悬浮的按钮 -->
		<div id="back-button" class='back-box'>
			<image src="./image/back.png" class="back-image"></image>
		</div>
		<div class='action-buttons'>
			<div id="save-button">
				<image src="./image/save.png" class="save-image"></image>
				<span class="save-class">保存</span>
			</div>
			<div class="line"></div>
			<div id="finish-button">
				<image src="./image/finish.png" class="finish-image"></image>
				<span class="finish-class">完成</span>
			</div>
			<div class="line"></div>
			<div id="menu-button">
				<image src="./image/menu.png" class="menu-image"></image>
			</div>
		</div>

		<div class='pagination-class'>
			<div id="pre-button">
				<image src="./image/pre.png" class="pagination-image"></image>
			</div>
			<div style="color:#FFFFFF;" class='current-pagination'></div>
			<div>/</div>
			<div class="total-pagination"></div>
			<div id="next-button">
				<image src="./image/next.png" class="pagination-image"></image>
			</div>
		</div>
		<div class="mark-box-class">
			<div class='obsolete-class'>
				已作废
			</div>
			<div class='copy-class'>
				副本
			</div>
		</div>
	</body>
	<!-- uni 的 SDK，必须引用。 -->
	<script type="text/javascript" src="./js/uni.webview.1.5.5.js"></script>
	<!-- Vconsole -->
	<!-- <script type="text/javascript" src="https://cdn.bootcss.com/vConsole/3.2.2/vconsole.min.js"></script> -->
	<!-- Jquery -->
	<script src="./js/jquery-3.4.1.min.js.js"></script>

	<script src="./js/event.js"></script>
	<script type="text/javascript">
		// const vconsole = new VConsole()
		$(function() {
			$(document).bind('UniAppJSBridgeReady', () => {
				console.log('UniAppJSBridgeReady-RENDER');
				// 隐藏复制和作废标识
				$('.copy-class').hide()
				$('.obsolete-class').hide()
				addEventForActionButtons()
				uni.postMessage({
					data: {
						type: 'RENDER'
					}
				});
			})
		})
	</script>
</html>
