spring:
  profiles:
    active: prod
  application:
    name: bmos-gateway-service
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        instance-enabled: ${NACOS_ENABLE_SERVICE:true}
        register-enabled: ${NACOS_ENABLE_SERVICE:true}
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        shared-configs:
          - data-id: bmos-redis.yaml
            group-id: DEFAULT_GROUP
        file-extension: yaml
        username: nacos
        password: nacos
  config:
    import:
      - optional:nacos:bmos-redis.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml